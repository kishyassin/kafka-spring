<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analytics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/smoothie/1.34.0/smoothie.min.js"></script>
</head>
<body>

<canvas id="chart2" width="600" height="400"></canvas>
<script>
    var colors = [
        { stroke: 'rgba(0, 255, 0, 1)', fill: 'rgba(0, 255, 0, 0.2)' },
        { stroke: 'rgba(255, 0, 0, 1)', fill: 'rgba(255, 0, 0, 0.2)' },
        { stroke: 'rgba(0, 0, 255, 1)', fill: 'rgba(0, 0, 255, 0.2)' },
        { stroke: 'rgba(255, 165, 0, 1)', fill: 'rgba(255, 165, 0, 0.2)' }
    ];

    var index = -1;
    function randomColor() {
        ++index;
        if (index >= colors.length) index = 0;
        return colors[index];
    }

    var courbe = {};
    var smoothieChart = new SmoothieChart({ tooltip: true });
    smoothieChart.streamTo(document.getElementById("chart2"), 500);

    function getOrCreateSeries(pageName) {
        if (!courbe[pageName]) {
            courbe[pageName] = new TimeSeries();
            var col = randomColor();
            smoothieChart.addTimeSeries(courbe[pageName], {
                strokeStyle: col.stroke,
                fillStyle: col.fill,
                lineWidth: 2
            });
        }
        return courbe[pageName];
    }

    var stockEventSource = new EventSource("/analytics");
    stockEventSource.addEventListener("message", function (event) {
        var data = JSON.parse(event.data);
        var now = new Date().getTime();
        Object.keys(data).forEach(function (pageName) {
            var series = getOrCreateSeries(pageName);
            series.append(now, data[pageName]);
        });
    });
</script>
</body>
</html>
